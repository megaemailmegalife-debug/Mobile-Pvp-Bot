name: Push Clockwork Rebellion Site source
on:
  push:
    branches: [codex/clockwork-rebellion-video-20261021]
    paths: [.github/workflows/clockwork-site-push.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Prepare remote publisher
        run: python -m pip install --quiet cryptography requests
      - name: Push Site source with an ephemeral encrypted credential
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python SitesSupport/push-site.py
