name: Clockwork Rebellion finished video
on:
  push:
    branches: [codex/clockwork-rebellion-video-20261021]
    paths:
      - '.github/workflows/clockwork-rebellion.yml'
      - 'Video/ClockworkRebellion/**'
permissions:
  contents: read
  actions: read
jobs:
  package:
    name: Assemble and verify finished music video
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio and video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39696023810
          pattern: Clockwork-Rebellion-part-*
          merge-multiple: true
          path: Video/ClockworkRebellion/output
      - name: Soundtrack, assembly and verification
        run: |
          python Video/ClockworkRebellion/audio.py
          python Video/ClockworkRebellion/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Clockwork-Rebellion-Full-Music-Video
          path: |
            Video/ClockworkRebellion/output/Clockwork-Rebellion.mp4
            Video/ClockworkRebellion/output/verification.json
            Video/ClockworkRebellion/README.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
